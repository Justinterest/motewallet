openapi: 3.0.3
info:
  title: Motewallet Withdrawal API
  description: 钱包提现系统 API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: 开发环境

tags:
  - name: Health
    description: 健康检查
  - name: Merchant Auth
    description: 商户认证
  - name: Admin Auth
    description: 管理员认证

paths:
  /health:
    get:
      tags: [Health]
      summary: 健康检查
      operationId: healthCheck
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok

  /api/v1/auth/register:
    post:
      tags: [Merchant Auth]
      summary: 商户注册
      operationId: merchantRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MerchantInfo"
        "400":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 邮箱已注册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      tags: [Merchant Auth]
      summary: 商户登录
      operationId: merchantLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MerchantInfo"
        "401":
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    post:
      tags: [Merchant Auth]
      summary: 商户登出
      operationId: merchantLogout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 登出成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=; Path=/; HttpOnly; Max-Age=0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [Merchant Auth]
      summary: 获取当前商户信息
      operationId: merchantMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MerchantInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/auth/login:
    post:
      tags: [Admin Auth]
      summary: 管理员登录
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: admin_token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminInfo"
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/auth/logout:
    post:
      tags: [Admin Auth]
      summary: 管理员登出
      operationId: adminLogout
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 登出成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: admin_token=; Path=/; HttpOnly; Max-Age=0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/auth/me:
    get:
      tags: [Admin Auth]
      summary: 获取当前管理员信息
      operationId: adminMe
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: 商户 JWT Token（httpOnly Cookie）
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: admin_token
      description: 管理员 JWT Token（httpOnly Cookie）

  schemas:
    BaseResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 10001
        message:
          type: string
          example: invalid credentials

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: merchant@example.com
        password:
          type: string
          minLength: 8
          maxLength: 64
          example: "SecurePass123"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: merchant@example.com
        password:
          type: string
          example: "SecurePass123"

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: superadmin
        password:
          type: string
          example: "Admin@2024"

    MerchantInfo:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          example: 1
        email:
          type: string
          example: merchant@example.com
        status:
          type: string
          enum: [PENDING_AGREEMENT, PENDING_KYC, ACTIVE, SUSPENDED, CLOSED]
          example: PENDING_AGREEMENT
        kyc_status:
          type: string
          enum: [NOT_SUBMITTED, PENDING, APPROVED, REJECTED]
          example: NOT_SUBMITTED
        created_at:
          type: string
          format: date-time

    AdminInfo:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          example: 1
        username:
          type: string
          example: superadmin
        email:
          type: string
          example: admin@motewallet.com
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, OPERATOR, AUDITOR, VIEWER]
          example: SUPER_ADMIN

  responses:
    Unauthorized:
      description: 未认证或 Token 过期
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 10004
              message:
                type: string
                example: unauthorized
