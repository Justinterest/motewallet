openapi: 3.0.3
info:
  title: Motewallet Withdrawal API
  description: 钱包提现系统 API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: 开发环境

tags:
  - name: Health
    description: 健康检查
  - name: Merchant Auth
    description: 商户认证
  - name: Admin Auth
    description: 管理员认证

paths:
  /health:
    get:
      tags: [Health]
      summary: 健康检查
      operationId: healthCheck
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok

  /api/v1/auth/send-verification-code:
    post:
      tags: [Merchant Auth]
      summary: 发送注册邮箱验证码
      operationId: merchantSendVerificationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendVerificationCodeRequest"
      responses:
        "200":
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "400":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 邮箱已注册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/register:
    post:
      tags: [Merchant Auth]
      summary: 商户注册（完成后需绑定两步验证）
      operationId: merchantRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功，返回两步验证绑定信息（尚未签发 session cookie）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthChallenge"
        "400":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 邮箱已注册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      tags: [Merchant Auth]
      summary: 商户登录（第一步：校验邮箱密码）
      operationId: merchantLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: |
            返回 AuthChallenge：
            - REQUIRES_2FA：已开启两步验证，需调用 /auth/2fa/verify
            - REQUIRES_2FA_SETUP：未开启或已被管理员重置，需绑定后调用 /auth/2fa/setup/confirm
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthChallenge"
        "401":
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/2fa/verify:
    post:
      tags: [Merchant Auth]
      summary: 登录两步验证码校验
      operationId: merchantVerify2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpVerifyRequest"
      responses:
        "200":
          description: 验证成功，签发 session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthChallenge"
        "400":
          description: 验证码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/2fa/setup/confirm:
    post:
      tags: [Merchant Auth]
      summary: 确认绑定两步验证（注册或重新绑定）
      operationId: merchantConfirm2FASetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpVerifyRequest"
      responses:
        "200":
          description: 绑定成功，签发 session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthChallenge"
        "400":
          description: 验证码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/2fa/status:
    get:
      tags: [Merchant Auth]
      summary: 获取两步验证状态
      operationId: merchantTotpStatus
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TotpStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/2fa/rebind/prepare:
    post:
      tags: [Merchant Auth]
      summary: 准备重新绑定两步验证（需当前验证码）
      operationId: merchantTotpRebindPrepare
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_code]
              properties:
                current_code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: 返回新的 TOTP secret 与 URI
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TotpSetup"
        "400":
          description: 当前验证码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/2fa/rebind/confirm:
    post:
      tags: [Merchant Auth]
      summary: 确认重新绑定两步验证
      operationId: merchantTotpRebindConfirm
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: 重新绑定成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "400":
          description: 新验证码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Merchant Auth]
      summary: 商户登出
      operationId: merchantLogout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 登出成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=; Path=/; HttpOnly; Max-Age=0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [Merchant Auth]
      summary: 获取当前商户信息
      operationId: merchantMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MerchantInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/auth/login:
    post:
      tags: [Admin Auth]
      summary: 管理员登录
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: admin_token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminInfo"
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/auth/logout:
    post:
      tags: [Admin Auth]
      summary: 管理员登出
      operationId: adminLogout
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 登出成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: admin_token=; Path=/; HttpOnly; Max-Age=0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/auth/me:
    get:
      tags: [Admin Auth]
      summary: 获取当前管理员信息
      operationId: adminMe
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/account/ledger:
    get:
      tags: [Merchant Auth]
      summary: 查询钱包资金变化
      description: 返回 wallet_ledger 变动明细（含余额/冻结前后值）
      operationId: getAccountLedger
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: account_type
          in: query
          schema:
            type: string
            enum: [FUNDING, TRADING]
        - name: currency
          in: query
          schema:
            type: string
        - name: biz_type
          in: query
          schema:
            type: string
            enum: [DEPOSIT, WITHDRAWAL, EXCHANGE, TRANSFER]
        - name: entry_type
          in: query
          schema:
            type: string
            enum: [CREDIT, FREEZE, UNFREEZE, DEDUCT_FROZEN]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WalletLedgerListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: 商户 JWT Token（httpOnly Cookie）
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: admin_token
      description: 管理员 JWT Token（httpOnly Cookie）

  schemas:
    BaseResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 10001
        message:
          type: string
          example: invalid credentials

    RegisterRequest:
      type: object
      required: [email, password, verification_code]
      properties:
        email:
          type: string
          format: email
          example: merchant@example.com
        password:
          type: string
          minLength: 8
          maxLength: 64
          example: "SecurePass123"
        verification_code:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    SendVerificationCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: merchant@example.com

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: merchant@example.com
        password:
          type: string
          example: "SecurePass123"

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: superadmin
        password:
          type: string
          example: "Admin@2024"

    MerchantInfo:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          example: 1
        email:
          type: string
          example: merchant@example.com
        status:
          type: string
          enum: [PENDING_AGREEMENT, PENDING_KYC, ACTIVE, SUSPENDED, CLOSED]
          example: PENDING_AGREEMENT
        kyc_status:
          type: string
          enum: [NOT_SUBMITTED, PENDING, APPROVED, REJECTED]
          example: NOT_SUBMITTED
        totp_enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

    AuthChallenge:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [SUCCESS, REQUIRES_2FA, REQUIRES_2FA_SETUP]
        temp_token:
          type: string
          description: 临时 token，用于后续 2FA 校验或绑定
        totp_secret:
          type: string
          description: TOTP base32 secret（仅 REQUIRES_2FA_SETUP）
        totp_uri:
          type: string
          description: otpauth URI，用于生成二维码（仅 REQUIRES_2FA_SETUP）
        merchant:
          $ref: "#/components/schemas/MerchantInfo"

    TotpVerifyRequest:
      type: object
      required: [temp_token, code]
      properties:
        temp_token:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    TotpStatus:
      type: object
      properties:
        enabled:
          type: boolean

    TotpSetup:
      type: object
      properties:
        totp_secret:
          type: string
        totp_uri:
          type: string

    AdminInfo:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          example: 1
        username:
          type: string
          example: superadmin
        email:
          type: string
          example: admin@motewallet.com
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, OPERATOR, AUDITOR, VIEWER]
          example: SUPER_ADMIN

    WalletLedgerEntry:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        account_type:
          type: string
          enum: [FUNDING, TRADING]
        currency:
          type: string
        entry_type:
          type: string
          enum: [CREDIT, FREEZE, UNFREEZE, DEDUCT_FROZEN]
        amount:
          type: string
        balance_before:
          type: string
        balance_after:
          type: string
        frozen_before:
          type: string
        frozen_after:
          type: string
        transaction_record_id:
          type: integer
          format: uint64
        platform_order_id:
          type: string
        biz_type:
          type: string
        remark:
          type: string
        created_at:
          type: string
          format: date-time

    WalletLedgerListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WalletLedgerEntry"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer

  responses:
    Unauthorized:
      description: 未认证或 Token 过期
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 10004
              message:
                type: string
                example: unauthorized
